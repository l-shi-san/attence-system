<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">注册</title>
    <style>
        .container { width: 350px; margin: 100px auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 3px; cursor: pointer; }
        .error { color: red; margin-bottom: 15px; }
        .link { text-align: center; margin-top: 15px; }
        a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <h2 th:text="${title}">学生注册</h2>

    <div th:if="${errorMsg}" class="error" th:text="${errorMsg}"></div>

    <form action="/register" method="post">
        <div class="form-group">
            <label>学号（用户名）：</label>
            <input type="text" name="studentNo" required/>
        </div>
        <div class="form-group">
            <label>姓名：</label>
            <input type="text" name="name" required/>
        </div>
        <div class="form-group">
            <label>密码：</label>
            <input type="password" name="password" required/>
        </div>
        <div class="form-group">
            <label>确认密码：</label>
            <input type="password" name="confirmPassword" required/>
        </div>
        <div class="form-group">
            <label>班级：</label>
            <input type="text" name="className" placeholder="例如：软件工程1班"/>
        </div>
        <div class="form-group">
            <label>性别：</label>
            <select name="gender">
                <option value="">请选择</option>
                <option value="男">男</option>
                <option value="女">女</option>
            </select>
        </div>
        <div class="form-group">
            <label>联系方式：</label>
            <input type="tel" name="phone" placeholder="手机号码"/>
        </div>
        <button type="submit">注册</button>
    </form>

    <div class="link">
        <a href="/login">已有账号？立即登录</a>
    </div>
</div>
</body>
</html>
