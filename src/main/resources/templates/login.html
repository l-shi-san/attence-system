<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">登录</title>
    <style>
        .container { width: 300px; margin: 100px auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        .error { color: red; margin-bottom: 15px; }
        .success { color: green; margin-bottom: 15px; }
        .link { text-align: center; margin-top: 15px; }
        a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <h2>用户登录</h2>

    <!-- 显示注册成功信息 -->
    <div th:if="${successMsg}" class="success" th:text="${successMsg}"></div>

    <!-- 显示错误信息（Spring Security 自动添加的 error 参数） -->
    <div th:if="${param.error}" class="error">
        用户名或密码错误，请重试
    </div>

    <!-- 显示退出成功信息 -->
    <div th:if="${param.logout}" class="success">
        已成功退出登录
    </div>

    <form action="/login" method="post">
        <div class="form-group">
            <label>用户名：</label>
            <input type="text" name="username" th:value="${param.username != null ? param.username[0] : ''}" required/>
        </div>
        <div class="form-group">
            <label>密码：</label>
            <input type="password" name="password" required/>
        </div>
        <button type="submit">登录</button>
    </form>

    <div class="link">
        <a href="/register">还没有账号？立即注册</a>
    </div>
</div>
</body>
</html>
