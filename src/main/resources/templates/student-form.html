<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">学生表单</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}"/>
    <style>
        .container { max-width: 600px; margin-top: 50px; }
        .error { color: red; font-size: 14px; margin-top: 5px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0" th:text="${title}">学生信息</h3>
        </div>
        <div class="card-body">
            <!-- 错误提示 -->
            <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

            <!-- 表单 -->
            <form th:action="@{/student/save}" th:method="post" th:object="${student}">
                <!-- 隐藏ID，用于编辑时识别 -->
                <input type="hidden" th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label">学号 <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{studentNo}" class="form-control" required/>
                    <div class="form-text">请输入学号，必须唯一</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">姓名 <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{name}" class="form-control" required/>
                </div>

                <div class="mb-3">
                    <label class="form-label">性别</label>
                    <select th:field="*{gender}" class="form-select">
                        <option value="">请选择</option>
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">出生日期</label>
                    <input type="date" th:field="*{birthDate}" class="form-control"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">联系方式</label>
                    <input type="tel" th:field="*{phone}" class="form-control" placeholder="手机号码"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">班级</label>
                    <input type="text" th:field="*{className}" class="form-control" placeholder="例如：软件工程1班"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">状态</label>
                    <select th:field="*{status}" class="form-select">
                        <option value="1">在读</option>
                        <option value="0">休学</option>
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <a href="/student/list" class="btn btn-secondary">返回</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
