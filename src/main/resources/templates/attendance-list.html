<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考勤记录列表</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}"/>
    <style>
        @media (max-width: 576px) { .card-header { flex-direction: column; gap: 8px; } }
    </style>
</head>
<body>
<div class="container mt-4 mb-4">
  <div class="card shadow">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h3 class="mb-0">📊 考勤记录列表</h3>
      <a href="/dashboard" class="btn btn-outline-light btn-sm">返回首页</a>
    </div>
    <div class="card-body">
      <form method="get" action="/attendance/list" class="row g-3 mb-4">
        <div class="col-md-8">
          <input type="text" name="keyword" class="form-control" placeholder="搜索学号、姓名或课程..."
                 th:value="${keyword}"/>
        </div>
        <div class="col-md-4">
          <button type="submit" class="btn btn-primary w-100">搜索</button>
        </div>
      </form>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <p class="text-muted mb-0">共 <strong th:text="${totalElements}">0</strong> 条记录</p>
        <a href="/attendance/export" class="btn btn-success btn-sm">📥 导出 Excel</a>
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>学号</th>
            <th>姓名</th>
            <th>课程名称</th>
            <th>打卡时间</th>
            <th>状态</th>
            <th>IP 地址</th>
            <th>备注</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="att : ${attendances}">
            <td th:text="${att.id}">1</td>
            <td th:text="${att.studentNo}">2023001</td>
            <td th:text="${att.studentName}">张三</td>
            <td th:text="${att.courseName}">Java EE</td>
            <td th:text="${#temporals.format(att.checkInTime, 'yyyy-MM-dd HH:mm:ss')}">2024-01-01 08:30</td>
            <td>
              <span th:if="${att.status == 'NORMAL'}" class="badge bg-success">正常</span>
              <span th:if="${att.status == 'LATE'}" class="badge bg-warning text-dark">迟到</span>
            </td>
            <td><code class="text-muted small" th:text="${att.ip ?: '-'}">-</code></td>
            <td th:text="${att.remark ?: '-'}">-</td>
          </tr>
          <tr th:if="${#lists.isEmpty(attendances)}">
            <td colspan="8" class="text-center text-muted py-4">暂无考勤记录</td>
          </tr>
          </tbody>
        </table>
      </div>

      <nav th:if="${totalPages > 1}">
        <ul class="pagination justify-content-center">
          <li th:class="${currentPage == 1} ? 'page-item disabled' : 'page-item'">
            <a class="page-link" th:href="@{/attendance/list(page=1, keyword=${keyword})}">首页</a>
          </li>
          <li th:class="${currentPage == 1} ? 'page-item disabled' : 'page-item'">
            <a class="page-link" th:href="@{/attendance/list(page=${prevPage}, keyword=${keyword})}">上一页</a>
          </li>
          <li class="page-item active">
            <span class="page-link" th:text="${currentPage} + ' / ' + ${totalPages}">1 / 1</span>
          </li>
          <li th:class="${currentPage == totalPages} ? 'page-item disabled' : 'page-item'">
            <a class="page-link" th:href="@{/attendance/list(page=${nextPage}, keyword=${keyword})}">下一页</a>
          </li>
          <li th:class="${currentPage == totalPages} ? 'page-item disabled' : 'page-item'">
            <a class="page-link" th:href="@{/attendance/list(page=${totalPages}, keyword=${keyword})}">末页</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</div>
</body>
</html>
