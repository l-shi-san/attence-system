<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考勤打卡</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}"/>
  <style>
    .container { max-width: 600px; margin-top: 50px; }
    .card { box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
    .time-display { font-size: 48px; font-weight: bold; text-align: center; margin: 20px 0; }
    .date-display { text-align: center; font-size: 18px; color: #666; margin-bottom: 20px; }
    .student-info { background-color: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
    @media (max-width: 576px) {
      .time-display { font-size: 32px; }
      .container { margin-top: 20px; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="card-header bg-primary text-white">
      <h3 class="mb-0">考勤打卡</h3>
    </div>
    <div class="card-body">
      <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

      <div class="time-display" id="currentTime"></div>
      <div class="date-display" id="currentDate"></div>

      <div class="student-info" th:if="${student != null}">
        <div class="row">
          <div class="col-md-6"><strong>学号：</strong><span th:text="${student.studentNo}"></span></div>
          <div class="col-md-6"><strong>姓名：</strong><span th:text="${student.name}"></span></div>
          <div class="col-md-6"><strong>班级：</strong><span th:text="${student.className}"></span></div>
        </div>
      </div>

      <form method="post">
        <div class="mb-3">
          <label class="form-label">选择课程</label>
          <select name="courseId" class="form-select" required>
            <option value="">请选择课程</option>
            <option th:each="course : ${courses}"
                    th:value="${course.id}"
                    th:text="${course.courseName} + ' (' + ${course.startTime} + ' - ' + ${course.endTime} + ') ' + '【' + ${course.teacherName} + '】'">
            </option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">备注</label>
          <textarea name="remark" class="form-control" rows="3"
                    placeholder="可选，如有特殊情况请备注..."></textarea>
        </div>

        <div class="alert alert-info">
          <small>打卡有效时段：上课前 <strong>20 分钟</strong> 至上课后 <strong>5 分钟</strong>。
          上课前打卡为正常，上课后打卡为迟到，超出时段无法打卡。</small>
        </div>

        <div class="d-flex justify-content-between flex-wrap gap-2">
          <button type="submit" class="btn btn-primary flex-fill">确认打卡</button>
          <a href="/dashboard" class="btn btn-secondary flex-fill">返回首页</a>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  function updateTime() {
    var now = new Date();
    document.getElementById('currentTime').innerHTML = now.toLocaleTimeString('zh-CN', {hour12: false});
    document.getElementById('currentDate').innerHTML = now.toLocaleDateString('zh-CN', {year:'numeric', month:'long', day:'numeric'});
  }
  updateTime(); setInterval(updateTime, 1000);
</script>
</body>
</html>
