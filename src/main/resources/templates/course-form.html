<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title}">课程表单</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}"/>
</head>
<body>
<div class="container mt-5 mb-5" style="max-width: 650px;">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h3 class="mb-0" th:text="${title}">课程信息</h3>
    </div>
    <div class="card-body">
      <form th:action="@{/course/save}" method="post" th:object="${course}">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
          <label class="form-label">课程名称 *</label>
          <input type="text" th:field="*{courseName}" class="form-control" required/>
        </div>

        <div class="mb-3">
          <label class="form-label">课程代码</label>
          <input type="text" th:field="*{courseCode}" class="form-control"/>
        </div>

        <div class="mb-3">
          <label class="form-label">授课教师</label>
          <input type="text" th:field="*{teacherName}" class="form-control"/>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">开始时间</label>
            <input type="time" th:field="*{startTime}" class="form-control"/>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">结束时间</label>
            <input type="time" th:field="*{endTime}" class="form-control"/>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">星期几（1-7）</label>
          <input type="number" th:field="*{weekDay}" class="form-control" min="1" max="7"/>
        </div>

        <div class="mb-3">
          <label class="form-label">教室</label>
          <input type="text" th:field="*{classroom}" class="form-control"/>
        </div>

        <div class="mb-3">
          <label class="form-label">状态</label>
          <select th:field="*{status}" class="form-select">
            <option value="1">启用</option>
            <option value="0">停用</option>
          </select>
        </div>

        <div class="d-flex justify-content-between flex-wrap gap-2">
          <button type="submit" class="btn btn-primary flex-fill">保存</button>
          <a href="/course/list" class="btn btn-secondary flex-fill">返回</a>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
