<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>我的考勤记录</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}"/>
  <style>
    .container { max-width: 1000px; margin-top: 20px; }
    .stats-card { text-align: center; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
    .stats-card.total { background-color: #17a2b8; color: white; }
    .stats-card.normal { background-color: #28a745; color: white; }
    .stats-card.late { background-color: #ffc107; color: #333; }
    .status-normal { color: #28a745; font-weight: bold; }
    .status-late { color: #ffc107; font-weight: bold; }
  </style>
</head>
<body>
<div class="container">
  <div class="card shadow">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h3 class="mb-0">📊 我的考勤记录</h3>
      <div>
        <a href="/attendance/checkin" class="btn btn-light btn-sm">📝 打卡</a>
        <a href="/dashboard" class="btn btn-outline-light btn-sm">返回首页</a>
      </div>
    </div>
    <div class="card-body">

      <!-- 学生信息 -->
      <div class="row mb-4" th:if="${student != null}">
        <div class="col-md-4">
          <div class="stats-card total">
            <h2 th:text="${totalElements}">0</h2>
            <p>总打卡次数</p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stats-card normal">
            <h2 th:text="${normalCount}">0</h2>
            <p>正常出勤</p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stats-card late">
            <h2 th:text="${lateCount}">0</h2>
            <p>迟到次数</p>
          </div>
        </div>
      </div>

      <!-- 考勤记录表格 -->
      <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
          <th>课程名称</th>
          <th>打卡时间</th>
          <th>状态</th>
          <th>备注</th>
          <th>IP地址</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="attendance : ${attendances}">
          <td th:text="${attendance.courseName}">课程名称</td>
          <td th:text="${#temporals.format(attendance.checkInTime, 'yyyy-MM-dd HH:mm:ss')}">2024-01-01 08:30:00</td>
          <td>
            <span th:if="${attendance.status == 'NORMAL'}" class="status-normal">✓ 正常</span>
            <span th:if="${attendance.status == 'LATE'}" class="status-late">⚠ 迟到</span>
          </td>
          <td th:text="${attendance.remark}">-</td>
          <td th:text="${attendance.ip}">127.0.0.1</td>
        </tr>
        <tr th:if="${#lists.isEmpty(attendances)}">
          <td colspan="5" class="text-center text-muted py-4">暂无考勤记录，<a href="/attendance/checkin">去打卡</a></td>
        </tr>
        </tbody>
      </table>

      <nav th:if="${totalPages > 1}">
        <ul class="pagination justify-content-center">
          <li th:class="${currentPage == 1} ? 'page-item disabled' : 'page-item'">
            <a class="page-link" th:href="@{/attendance/my-list(page=${prevPage})}">上一页</a>
          </li>
          <li class="page-item active">
            <span class="page-link" th:text="${currentPage} + ' / ' + ${totalPages}">1 / 1</span>
          </li>
          <li th:class="${currentPage == totalPages} ? 'page-item disabled' : 'page-item'">
            <a class="page-link" th:href="@{/attendance/my-list(page=${nextPage})}">下一页</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</div>
</body>
</html>
