<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学期配置 - 班级考勤管理系统</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}"/>
  <style>
    .container { max-width: 600px; margin-top: 40px; }
    .card { box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
    .info-block { background-color: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
    @media (max-width: 576px) {
      .container { margin-top: 15px; }
      .card-header { flex-direction: column; gap: 8px; text-align: center; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="card shadow">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h3 class="mb-0">📅 学期配置</h3>
      <a href="/dashboard" class="btn btn-outline-light btn-sm">返回首页</a>
    </div>
    <div class="card-body">
      <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" th:text="${successMsg}">
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" th:text="${errorMsg}">
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      <div class="alert alert-info">
        <strong>💡 说明：</strong>教学周从学期第1周（周一）开始计算，用于"按周统计"。
      </div>
      <div class="info-block">
        <div class="row">
          <div class="col-md-6">
            <p class="mb-1"><strong>当前学期起始日：</strong></p>
            <h4 class="text-primary" th:text="${semesterStart}">2026-02-23</h4>
          </div>
          <div class="col-md-6">
            <p class="mb-1"><strong>当前教学周：</strong></p>
            <h4 class="text-success" th:text="${currentWeek} + ' 周'">1 周</h4>
          </div>
        </div>
      </div>
      <h5 class="mb-3">✏️ 修改学期起始日期</h5>
      <form method="post" action="/admin/semester">
        <div class="mb-3">
          <label class="form-label">教学第1周的周一日期</label>
          <input type="date" name="startDate" class="form-control form-control-lg"
                 th:value="${semesterStart}" required/>
          <div class="form-text">修改后将影响考勤"按周统计"的周次计算。</div>
        </div>
        <div class="d-flex justify-content-between flex-wrap gap-2">
          <button type="submit" class="btn btn-primary flex-fill">💾 保存配置</button>
          <a href="/dashboard" class="btn btn-secondary flex-fill">返回首页</a>
        </div>
      </form>
    </div>
  </div>
</div>
<script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
